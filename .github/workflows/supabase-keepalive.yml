name: supabase-keepalive

# Ping diario a la DB de Varios-CAG (qfurtndfrvgxburrpvyc) para que el proyecto
# free-tier registre actividad y no se auto-pause tras ~7 dias sin partidas.
# El SELECT debe TOCAR la DB; un /health que no consulta Supabase NO sirve.
# La clave publica basta: golf_courses tiene politica de lectura abierta.

on:
  schedule:
    - cron: "0 6 * * *"   # diario 06:00 UTC (01:00 Bogota)
  workflow_dispatch: {}    # disparo manual de verificacion

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST (SELECT 1 fila de golf_courses)
        run: |
          curl -sf "https://qfurtndfrvgxburrpvyc.supabase.co/rest/v1/golf_courses?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -o /dev/null -w "HTTP %{http_code}\n"
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
